# Nginx configuration for routing two MCP servers through one port
# This allows a single ngrok URL to forward to both servers

events {
    worker_connections 1024;
}

http {
    # Serper+Jina server (port 8001)
    upstream serper_jina {
        server localhost:8001;
    }
    
    # Semantic Scholar+Jina server (port 8002)
    upstream semantic_scholar_jina {
        server localhost:8002;
    }
    
    server {
        listen 8080;
        server_name localhost;
        
        # Route /serper/* to Serper+Jina server
        location /serper {
            rewrite ^/serper(.*)$ $1 break;
            proxy_pass http://serper_jina;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass filter configuration headers (not visible to model)
            proxy_set_header X-Source-Title $http_x_source_title;
            proxy_set_header X-Publication-Date $http_x_publication_date;
            
            # Support SSE (Server-Sent Events) for MCP
            proxy_set_header Accept "application/json, text/event-stream";
            proxy_buffering off;
            proxy_cache off;
        }
        
        # Route /semantic/* to Semantic Scholar+Jina server
        location /semantic {
            rewrite ^/semantic(.*)$ $1 break;
            proxy_pass http://semantic_scholar_jina;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass filter configuration headers (not visible to model)
            proxy_set_header X-Source-Title $http_x_source_title;
            proxy_set_header X-Publication-Date $http_x_publication_date;
            
            # Support SSE (Server-Sent Events) for MCP
            proxy_set_header Accept "application/json, text/event-stream";
            proxy_buffering off;
            proxy_cache off;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}

