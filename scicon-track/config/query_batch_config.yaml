# Models evaluated each monthly run.
# Add or remove providers/models here to control which models are benchmarked.
#
# Each key is a provider name; the value is either a single model name or a
# list of model names. List values let one provider (e.g. openrouter) run
# several distinct models every month.

enable_tool_calling: true
enable_filtering: true

default_models:
  openai: gpt-5.6-sol
  claude: claude-opus-5
  gemini: gemini-3.1-pro
  perplexity: sonar-reasoning-pro
  # DeepSeek-V4-Pro — Azure Foundry Chat Completions (COCHRANE_DASHBOARD_* creds).
  azure: DeepSeek-V4-Pro
  # OpenRouter-hosted models — Kimi K3, GLM-5.2, Qwen3.5-9B, Qwen3.7-max.
  openrouter:
    - moonshotai/kimi-k3
    - z-ai/glm-5.2
    - qwen/qwen3.5-9b
    - qwen/qwen3.7-max
