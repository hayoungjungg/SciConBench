# Models evaluated each run.
# Add or remove providers/models here to control which models are benchmarked.
#
# Each key is a provider name; the value is either a single model name or a
# list of model names. List values let one provider (e.g. openrouter, azure)
# run several distinct models every run.

enable_tool_calling: true
enable_filtering: true

# Response quality-check retry: SciConHarness.query() re-queries a DOI up to
# this many times if the response is missing a well-formed [[[...]]]
# conclusion of at least min_conclusion_length characters.
max_format_retries: 4
min_conclusion_length: 50

# Per-turn output cap for every configured provider (mapped to
# max_output_tokens for GPT/Gemini and max_tokens elsewhere). Also bounds
# OpenRouter's in-flight credit reservation.
max_tokens: 8192

# Evaluate the current core plus only the most recent N closed rolling cohorts.
# This prevents a newly added model from backfilling the entire rolling history.
rolling_panel_months: 4

default_models:
  openai: gpt-5.6-sol
  claude: claude-opus-5
  gemini: gemini-3.7-flash
  # Azure Foundry Chat Completions on the Cochrane Dashboard resource
  # (same COCHRANE_DASHBOARD_* creds as openai GPT). Queried in the
  # azure_openai lane *after* openai GPT finishes.
  azure:
    - DeepSeek-V4-Pro
    - DeepSeek-V4-Flash-0731  # control
  # OpenRouter-hosted models — Kimi K3, GLM-5.3, Qwen3.8-max, plus
  # control-scale Qwen3.8-27B and MiniMax M3 (alongside Azure DeepSeek-V4-Flash).
  openrouter:
    - moonshotai/kimi-k3
    - z-ai/glm-5.3
    - qwen/qwen3.8-max
    - qwen/qwen3.8-27b    # control
    - minimax/minimax-m3  # control

# OpenRouter key assignment (NOT concurrent lanes — all OpenRouter models
# run strictly one at a time in a single query lane).
# Models in base_model_lane → OPENROUTER_API_KEY_BASE_MODEL.
# Everything else (listed in generic_lane or unlisted) → OPENROUTER_API_KEY.
# Pipeline run order = base_model_lane list, then generic_lane list.
openrouter_base_model_lane:          # OPENROUTER_API_KEY_BASE_MODEL
  - z-ai/glm-5.3
  - qwen/qwen3.8-max
openrouter_generic_lane:             # OPENROUTER_API_KEY
  - moonshotai/kimi-k3               # first among this key's models
  - qwen/qwen3.8-27b                 # control
  - minimax/minimax-m3               # control

# Default policy: every model evaluates each DOI once, ever. Later monthly
# runs only pick up newly closed rolling DOIs (and missing responses still
# inside the rolling window). Adding a new model name evaluates the core plus
# the latest rolling_panel_months cohorts, not the full rolling history. Put a
# model here only if you want it re-queried every run against that same window.
reevaluate_always: []
