# Models evaluated each monthly run.
# Add or remove providers here to control which models are benchmarked.

enable_tool_calling: true
enable_filtering: true

# One model per provider — all are queried every month
default_models:
  openai: gpt-5.1
  claude: claude-sonnet-5
  gemini: gemini-3.1-pro-preview
  perplexity: sonar-reasoning-pro
